[package]
name = "openmls_push"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "C API over openmls_frb's engine for a process that decrypts while the app is not running, e.g. the iOS notification service"
license = "MIT"
publish = false

[lib]
name = "openmls_push"
crate-type = ["staticlib", "rlib"]

[dependencies]
# a path dependency, so the extension reads the database with the very engine
# the app writes it with
openmls_frb = { path = "../rust" }
futures = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
opt-level = "z"
strip = true
